<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프런트엔드 개발자 지원서</title>
</head>
<body>
    <form>
        <fieldset>
            <h1>프런트엔드 개발자 지원서</h1>
            <p></p>
            <p>html, css, 자바스크립트의 기술을 이해하고 실무 경험이 있는 분을 찾습니다.</p>
            <hr>
            <label>개인정보</label>
            <ul>
            <li>
                <label for="user-name">이름</label>
                <input type="text" id="user-name" autofocus placeholder="공백 없이 입력하세요">
            </li>
            <li>
                <label for="phone">연락처</label>
                <input type="text" id="phone">
            </li>
            <p></p>              
            </ul>
            <label>지원 분야</label>
            <p></p>
            <ul>
            <li>
                <label><input type="radio" name="wp">웹 퍼블리싱</label>             
            </li>
            <li>
                <label><input type="radio" name="wa">웹 애플리케이션</label>   
            </li>
            <li>
                <label><input type="radio" name="gh">개발 환경 개선</label>
            </li>                
            </ul>
            <label>지원동기</label>
            <p></p>
            <textarea id="memo" cols="60" rows="5" placeholder="본사 지원 동기를 간략히 써 주세요."></textarea>

            <div>
            <input type="button" value="접수하기">
            <input type="reset" value="다시 쓰기">                
            </div>

        </fieldset>
    </form>
    
</body>
</html>
