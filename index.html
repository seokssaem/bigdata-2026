<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>농산물 정기배송</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 헤더 -->
     <header>
        <nav>
            <h1 class="logo">'못난이 농산물' 정기배송</h1>
            <div>
                <button class="lang"><i class="fa-solid fa-globe"></i>한국어<i class="fa-solid fa-square-caret-down"></i></button>
                <button>로그인</button>
            </div>
        </nav>
        <div class="header-content">
            <h2>못생겨도 맛있는 특별한 친환경 채소를 정기배송합니다.</h2>
            <h3>같은 땅에서 똑같이 건강하게 자랐지만 농산물의 모양, 크기, 과잉 생산의 이유로 매해 전체 생산량의 1/3이 폐기되고 있습니다. </h3>
            <h3>특이한 생김새로 인해 버려질 위기에 처한, 속만큼은 고품질인 채소 과일들을 저렴하게 구독해보세요. </h3>
            <h3>친환경 농산물의 가치를 찾아 음식물 폐기와 낭비를 막고 건강한 땅이 지속가능하게 합니다. </h3>
            <p>이메일 주소를 보내시면 구독 안내문과 새로운 소식을 보내 드립니다.</p>
            <form class="add-email">
                <input type="email" placeholder="abcd1234@example.com" required> 
                <button type="submit">보내기</button>
            </form>
        </div>


     </header>


</body>
</html>
