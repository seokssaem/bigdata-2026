<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예약 정보</title>
</head>
<body>
    <form>
        <fieldset>
            <h1>예약 정보</h1>            
        <ul>

            <li>
                <label for="r-name">이 름</label>
                <input type="name" id="r-name">
            </li>
            <p></p>
            <li>
                <label for="r-phone">전 화</label>
                <input type="phone" id="r-phone">
            </li>
            <p></p>
            <li>
                <label for="r-email">이 메 일</label>
                <input type="email" id="r-email">
            </li>
            <p></p>
            <li>
                <input type="submit" value="예약하기">
            </li>
        </ul>            
        </fieldset>

    </form>

    
</body>
</html>
