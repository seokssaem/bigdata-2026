<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container {
            border: 0;
            margin: 0;
            width: 300px;
            display: grid;
            grid-template-areas:
                "b1 b2 b3"
                "b4 b5 b6"
                "b7 b8 b9"
            ;
            gap: 10px;
        }
        .box {
            border: 1px solid blue;
            padding: 0;
            width: 100px;
            height: 100px;
            text-align: center;
        }
        .box:nth-child(odd) {background-color: aquamarine;}
        .box:nth-child(even) {background-color: aqua;}
        #box1 {grid-area: b1;}
        #box2 {grid-area: b2;}
        #box3 {grid-area: b3;}
        #box4 {grid-area: b4;}
        #box5 {grid-area: b5;}
        #box6 {grid-area: b6;}
        #box7 {grid-area: b7;}
        #box8 {grid-area: b8;}
        #box9 {grid-area: b9;}
    </style>

</head>
<body>
    <div class="container">
        <div class="box" id="box1">box1</div>
        <div class="box" id="box2">box2</div>
        <div class="box" id="box3">box3</div>
        <div class="box" id="box4">box4</div>
        <div class="box" id="box5">box5</div>
        <div class="box" id="box6">box6</div>
        <div class="box" id="box7">box7</div>
        <div class="box" id="box8">box8</div>
        <div class="box" id="box9">box9</div>
</body>
</html>
