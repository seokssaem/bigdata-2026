<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container {
            border: 0;
            margin: 0;
            width: 400px;
            height: 300px;
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
        }
        .box {
            border: 1px solid blue;
            padding: 0;
            width: auto;
            height: auto;
            text-align: center;
            background-color: bisque;
        }
        #box1 {
            grid-column-start: 1;
            grid-row: 1 / 3;
        }
        #box2 {
            grid-column: 2 / 4;
            grid-row-start: 1;
        }
        #box3 {
            grid-column-start: 2;
            grid-row: 2 / 4;
        }
        #box4 {
            grid-column-start: 3;
            grid-row: 2 / 4;
        }
        #box5 {
            grid-column-start: 1;
            grid-row-start: 3;
        }
    </style>

</head>
<body>
    <div class="container">
        <div class="box" id="box1">box1</div>
        <div class="box" id="box2">box2</div>
        <div class="box" id="box3">box3</div>
        <div class="box" id="box4">box4</div>
        <div class="box" id="box5">box5</div>
</body>
</html>
