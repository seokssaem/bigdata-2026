{% extends "base.html" %}

{% block title %}회원가입 - 생필품 가격 리포트{% endblock %}

{% block content %}
<div class="auth-card">
    <h1>회원가입</h1>
    <p class="hint">아이디와 비밀번호만 있으면 돼요.</p>

    {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}

    <form method="post" action="/signup" class="auth-form">
        <input type="hidden" name="next" value="{{ next }}">

        <label for="username">아이디</label>
        <input id="username" type="text" name="username" value="{{ username }}"
               autocomplete="username" minlength="3" maxlength="20" required autofocus>
        <span class="field-hint">한글, 영문, 숫자, _ 로 3~20자</span>

        <label for="password">비밀번호</label>
        <input id="password" type="password" name="password" autocomplete="new-password"
               minlength="8" maxlength="128" required>
        <span class="field-hint">8자 이상</span>

        <label for="password2">비밀번호 확인</label>
        <input id="password2" type="password" name="password2" autocomplete="new-password"
               minlength="8" maxlength="128" required>

        <button type="submit">가입하기</button>
    </form>

    <p class="auth-switch">이미 계정이 있나요? <a href="/login?next={{ next|urlencode }}">로그인</a></p>
</div>
{% endblock %}
