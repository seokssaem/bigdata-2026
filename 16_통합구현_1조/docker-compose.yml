# movie1 - docker-compose.yml
# db(PostgreSQL) + api(FastAPI) + web(Streamlit) 세 컨테이너를 한 번에 실행

services:
  db:
    image: postgres:17   # 공식 PostgreSQL 이미지를 그대로 사용 (별도 Dockerfile 불필요)
    container_name: movie-db

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      # 컨테이너를 지워도 데이터가 남도록 named volume에 저장
      - movie_pgdata:/var/lib/postgresql/data

    healthcheck:
      # PostgreSQL이 접속을 받을 준비가 되었는지 확인
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile   # 공용 Dockerfile 사용
    container_name: movie-api

    ports:
      - "8000:8000"   # "호스트포트:컨테이너포트"

    environment:
      # 컨테이너 안에서 db에 접속할 때는 localhost가 아니라
      # docker-compose.yml에 적은 서비스 이름 "db"를 주소로 사용해야 함
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

    depends_on:
      db:
        # db가 단순히 "실행"만 된 상태가 아니라, healthcheck를 통과해
        # 실제로 접속 가능해진 뒤에 api를 실행
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile   # 공용 Dockerfile 사용 (api와 동일 이미지)
    container_name: movie-web

    ports:
      - "8501:8501"

    environment:
      # 컨테이너 안에서 api 컨테이너에 접속할 때는 localhost가 아니라
      # 서비스 이름 "api"를 주소로 사용해야 함
      API_URL: http://api:8000
      KOBIS_API_KEY: ${KOBIS_API_KEY}

    depends_on:
      - api   # api가 먼저 뜬 뒤 web을 실행

    command: >
      streamlit run streamlit_app.py
      --server.address=0.0.0.0
      --server.port=8501

volumes:
  movie_pgdata:
